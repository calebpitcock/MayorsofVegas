<!doctype html>
<html lang="en">
<head>
<title>Beer League Flappy Buck</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
img,canvas{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;margin:0}
:root{
  --ink:#070A14;
  --panel:#10152A;
  --panel2:#171E38;
  --edge:rgba(242,193,78,.17);
  --edge-hi:rgba(242,193,78,.42);
  --scarlet:#E03A45;
  --scarlet-dim:#7E1F28;
  --gold:#F2C14E;
  --mist:#9AA4BF;
  --mist-dim:#5C6684;
  --text:#EEF1FA;
  --turf:#1F6B45;
  --silver:#B4BCC9;
  --leaf:#5AA85F;
  --ok:#4FD08A;
  --shadow:0 10px 30px rgba(0,0,0,.55);
  --f-disp:"Bungee","Barlow Condensed",Impact,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
body{
  background:var(--ink);
  background-image:
    radial-gradient(120% 60% at 50% -10%, rgba(224,58,69,.22), transparent 60%),
    radial-gradient(100% 55% at 50% 108%, rgba(242,193,78,.13), transparent 62%);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--f-body);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  min-height:100dvh;
}
.wrap{
  max-width:480px;margin:0 auto;
  padding:14px 14px calc(34px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;
}
.card{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--edge);border-radius:15px;padding:15px;
  box-shadow:var(--shadow);
}
.marquee{position:relative;text-align:center;padding:20px 15px 17px;overflow:hidden}
.marquee::before,.marquee::after{
  content:"";position:absolute;left:9px;right:9px;height:5px;
  background-image:radial-gradient(circle at 50% 50%, var(--gold) 1.6px, rgba(242,193,78,.13) 2px, transparent 2.4px);
  background-size:13px 5px;opacity:.85;
}
.marquee::before{top:7px}
.marquee::after{bottom:7px}
@media (prefers-reduced-motion:no-preference){
  .marquee::before,.marquee::after{animation:bulbs 2.6s steps(2,end) infinite}
  .marquee::after{animation-delay:1.3s}
}
@keyframes bulbs{0%,100%{opacity:.9}50%{opacity:.42}}
.eyebrow{
  font-family:var(--f-cond);font-weight:600;font-size:11px;
  letter-spacing:.28em;text-transform:uppercase;color:var(--mist);
}
.wordmark{
  font-family:var(--f-disp);font-size:clamp(27px,8.4vw,40px);line-height:1.02;
  margin:9px 0 8px;color:var(--gold);text-wrap:balance;
  text-shadow:0 0 9px rgba(242,193,78,.5),0 0 26px rgba(224,58,69,.42),0 3px 0 rgba(0,0,0,.45);
}
.wordmark .b{display:block;color:#FFF3D4;font-size:.72em;letter-spacing:.01em}
.subline{font-family:var(--f-cond);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
.subline b{color:var(--scarlet);font-weight:700}
h2{
  font-family:var(--f-cond);font-weight:700;font-size:14px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold);margin:0 0 11px;
  display:flex;align-items:center;gap:9px;
}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge-hi),transparent)}
p{margin:0 0 10px;line-height:1.55;color:var(--mist);font-size:14.5px;max-width:62ch}
p:last-child{margin-bottom:0}
/* ---- player select ---- */
.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.chip{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:9px 3px;border-radius:12px;border:1px solid transparent;
  background:rgba(255,255,255,.028);cursor:pointer;
  transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
.chip:hover{background:rgba(255,255,255,.06)}
.chip:active{transform:scale(.95)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.av{
  width:43px;height:43px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-disp);font-size:14px;color:var(--mist);
  background:radial-gradient(circle at 34% 28%,#2A3355,#141A31);
  border:1.5px solid rgba(154,164,191,.3);
}
.chip .nm{font-family:var(--f-cond);font-weight:600;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mist)}
.chip[aria-pressed="true"]{border-color:var(--edge-hi);background:rgba(242,193,78,.09)}
.chip[aria-pressed="true"] .av{
  color:#FFF;border-color:var(--scarlet);
  background:radial-gradient(circle at 34% 28%,#F0525C,#8C1C25);
  box-shadow:0 0 14px rgba(224,58,69,.55);
}
.chip[aria-pressed="true"] .nm{color:var(--gold)}
/* ---- buttons ---- */
.btn{
  font-family:var(--f-cond);font-weight:700;font-size:15px;letter-spacing:.13em;
  text-transform:uppercase;padding:13px 18px;border-radius:11px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid transparent;transition:transform .12s ease,filter .12s ease;
  touch-action:manipulation;
}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn-go{background:linear-gradient(180deg,#FFD66B,var(--gold));color:#1A1206;box-shadow:0 5px 0 #A57C1E,0 12px 22px rgba(242,193,78,.24)}
.btn-go:active{box-shadow:0 2px 0 #A57C1E}
.btn-go[disabled]{filter:grayscale(.75) brightness(.6);cursor:not-allowed;box-shadow:none}
.btn-ghost{border-color:var(--edge);color:var(--mist);background:rgba(255,255,255,.03)}
.btn-ghost:hover{color:var(--text);border-color:var(--edge-hi)}
.btn-red{background:linear-gradient(180deg,#F0525C,var(--scarlet));color:#fff;box-shadow:0 5px 0 #7E1F28}
.btn-red:active{box-shadow:0 2px 0 #7E1F28}
.btn-wide{width:100%}
.btn-sm{font-size:12.5px;padding:9px 12px;letter-spacing:.1em;border-radius:9px}
.btns{display:flex;gap:9px;flex-wrap:wrap}
.btns>.btn{flex:1 1 auto}
/* ---- identity strip ---- */
.you{display:flex;align-items:center;gap:11px;padding:11px 13px}
.you .av{width:38px;height:38px;font-size:13px;flex:none}
.you-txt{flex:1;min-width:0}
.you-nm{font-family:var(--f-cond);font-weight:700;font-size:17px;letter-spacing:.09em;text-transform:uppercase;color:var(--text);line-height:1.15}
.you-sub{font-family:var(--f-cond);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist-dim)}
.you-best{text-align:right;flex:none}
.you-best .n{font-family:var(--f-disp);font-size:23px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.you-best .l{font-family:var(--f-cond);font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--mist-dim)}
/* ---- game stage ---- */
.stage{
  position:relative;width:100%;aspect-ratio:400/640;border-radius:16px;overflow:hidden;
  border:1px solid var(--edge);background:#0A0E1E;box-shadow:var(--shadow),inset 0 0 60px rgba(0,0,0,.6);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer;
}
.stage canvas{width:100%;height:100%}
.stage.shake{animation:shake .32s ease}
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-5px,3px)}
  45%{transform:translate(4px,-3px)}
  70%{transform:translate(-3px,-2px)}
}
@media (prefers-reduced-motion:reduce){.stage.shake{animation:none}}
.hud{
  position:absolute;top:12px;left:0;right:0;text-align:center;pointer-events:none;
  font-family:var(--f-disp);font-size:40px;color:#fff;line-height:1;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(0,0,0,.8),0 3px 0 rgba(0,0,0,.5);
}
.ov{
  position:absolute;inset:0;display:grid;place-items:center;padding:18px;
  background:rgba(7,10,20,.82);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
}
.ov[hidden]{display:none}
.ov-in{text-align:center;width:100%;max-width:290px}
.ov-k{font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--mist)}
.ov-score{font-family:var(--f-disp);font-size:62px;line-height:1;color:var(--gold);margin:5px 0 3px;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(242,193,78,.42)}
.ov-note{font-family:var(--f-cond);font-size:14px;letter-spacing:.11em;text-transform:uppercase;margin:9px 0 15px;min-height:19px}
.ov-note.hot{color:var(--gold)}
.ov-note.cool{color:var(--mist-dim)}
.ov h3{font-family:var(--f-disp);font-size:23px;color:#FFF3D4;margin:0 0 7px;line-height:1.2}
.ov .tip{font-family:var(--f-body);font-size:13.5px;color:var(--mist);margin:0 0 15px;line-height:1.5}
.ov .btns{margin-top:3px}
/* ---- leaderboard ---- */
.board{display:flex;flex-direction:column;gap:5px}
.row{
  display:grid;grid-template-columns:26px 34px 1fr auto;align-items:center;gap:10px;
  padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.028);
  border:1px solid transparent;
}
.row .rk{font-family:var(--f-disp);font-size:13px;color:var(--mist-dim);text-align:center;font-variant-numeric:tabular-nums}
.row .av{width:31px;height:31px;font-size:11px;border-width:1px}
.row .who{font-family:var(--f-cond);font-weight:600;font-size:15.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who .tag{font-size:10.5px;letter-spacing:.16em;color:var(--mist-dim);display:block;font-weight:500}
.row .sc{font-family:var(--f-disp);font-size:18px;color:var(--text);font-variant-numeric:tabular-nums}
.row .sc.zero{color:var(--mist-dim);font-size:13px}
.row.top{background:linear-gradient(90deg,rgba(242,193,78,.15),rgba(242,193,78,.03));border-color:var(--edge-hi)}
.row.top .rk,.row.top .sc{color:var(--gold)}
.row.mine{box-shadow:inset 3px 0 0 var(--scarlet)}
.row.clock{border-color:var(--scarlet);background:rgba(224,58,69,.12)}
/* ---- draft slots ---- */
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slot{
  display:flex;align-items:center;gap:9px;padding:10px;border-radius:10px;
  background:rgba(255,255,255,.028);border:1px dashed rgba(154,164,191,.22);
}
.slot .pk{font-family:var(--f-disp);font-size:15px;color:var(--mist-dim);width:24px;text-align:center;flex:none}
.slot .who{font-family:var(--f-cond);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.filled{border-style:solid;border-color:var(--edge);background:rgba(242,193,78,.07)}
.slot.filled .pk{color:var(--gold)}
.slot.filled .who{color:var(--text)}
button.slot{cursor:pointer;width:100%;text-align:left;border-color:var(--edge-hi);background:rgba(242,193,78,.07)}
button.slot:hover{background:rgba(242,193,78,.15)}
button.slot .who{color:var(--gold)}
button.slot:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* ---- misc ---- */
.banner{
  display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:11px;
  font-size:13.5px;line-height:1.5;border:1px solid;
}
.banner .ic{font-family:var(--f-disp);font-size:13px;line-height:1.3;flex:none}
.banner.warn{background:rgba(242,193,78,.09);border-color:var(--edge-hi);color:#EBD9A8}
.banner.warn .ic{color:var(--gold)}
.banner.live{background:rgba(79,208,138,.08);border-color:rgba(79,208,138,.3);color:#B9E8CE}
.banner.live .ic{color:var(--ok)}
.clockbar{
  text-align:center;padding:12px;border-radius:11px;margin-bottom:11px;
  background:rgba(224,58,69,.13);border:1px solid rgba(224,58,69,.4);
}
.clockbar .k{font-family:var(--f-cond);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#F5A0A6}
.clockbar .v{font-family:var(--f-disp);font-size:21px;color:#fff;margin-top:3px}
.rules{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;font-size:14px;line-height:1.5;color:var(--mist)}
.rules .n{font-family:var(--f-disp);font-size:11px;color:var(--gold);flex:none;width:19px;padding-top:2px}
.rules b{color:var(--text);font-weight:600}
details.commish{margin-top:2px}
details.commish summary{
  font-family:var(--f-cond);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--mist-dim);cursor:pointer;padding:7px 0;list-style:none;
}
details.commish summary::-webkit-details-marker{display:none}
details.commish summary::before{content:"\2699  ";}
details.commish summary:hover{color:var(--mist)}
details.commish .in{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid rgba(154,164,191,.13)}
.foot{text-align:center;font-family:var(--f-cond);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mist-dim);padding:4px 0 0}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  background:var(--panel2);border:1px solid var(--edge-hi);color:var(--text);
  padding:11px 17px;border-radius:11px;box-shadow:var(--shadow);
  font-family:var(--f-cond);font-size:13.5px;letter-spacing:.09em;text-transform:uppercase;
  max-width:88vw;text-align:center;
}
/* ---- combine countdown ---- */
.countdown{text-align:center;padding:16px 15px 15px}
.cd-k{font-family:var(--f-cond);font-weight:600;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--mist)}
.cd-clock{display:flex;justify-content:center;gap:6px;margin:11px 0 0}
.cd-unit{flex:1 1 0;max-width:78px;padding:9px 4px 7px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(180,188,201,.16)}
.cd-n{font-family:var(--f-disp);font-size:clamp(20px,6.6vw,27px);line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
.cd-l{font-family:var(--f-cond);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--mist-dim);margin-top:5px}
.cd-when{margin-top:11px;font-family:var(--f-cond);font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--mist-dim);line-height:1.5}
.cd-when b{color:var(--mist);font-weight:600}
.countdown.soon .cd-unit{border-color:rgba(224,58,69,.42);background:rgba(224,58,69,.1)}
.countdown.soon .cd-n{color:#FFD9DC}
.countdown.soon .cd-k{color:#F5A0A6}
.countdown.done .cd-big{font-family:var(--f-disp);font-size:23px;color:var(--gold);margin:8px 0 4px;line-height:1.2}
.countdown.done .cd-k{color:var(--mist-dim)}
/* ---- scarlet + gray accents ---- */
.stripe{display:flex;height:4px;border-radius:2px;overflow:hidden;margin:11px 0 0}
.stripe i{flex:1}
.stripe i:nth-child(odd){background:var(--scarlet)}
.stripe i:nth-child(even){background:var(--silver)}
.chant{font-family:var(--f-disp);font-size:12px;letter-spacing:.14em;color:var(--scarlet)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

    .replace(PH_TPL, function(){ return t.b64; });
}
var DEAD_CODES = {not_writer:1, not_granted:1, not_declared:1, consent_required:1, capability_disabled:1, capability_removed:1};
function publishState(){
  if(!artifactApi){ if(!offline) readOnly = true; return Promise.resolve({ok:false, code:"offline"}); }
  if(publishing){ return Promise.resolve({ok:false, code:"busy"}); }
  publishing = true;
  return artifactApi.publish(buildDoc(state)).then(function(){
    publishing = false; return {ok:true};
  }, function(err){
    publishing = false;
    var code = (err && err.code) || "upstream_error";
    if(DEAD_CODES[code]){ readOnly = true; }
    return {ok:false, code:code};
  });
}

/* ---------- ranking + draft ---------- */
function bestOf(n){ var r = state.scores[n]; return (r && r.best) ? r.best : 0; }
function stampOf(n){ var r = state.scores[n]; return (r && r.at) ? r.at : Infinity; }
function ranked(){
  return NAMES.slice().sort(function(a,b){
    var d = bestOf(b) - bestOf(a); if(d) return d;
    var t = stampOf(a) - stampOf(b); if(t !== 0 && isFinite(t)) return t;
    return NAMES.indexOf(a) - NAMES.indexOf(b);
  });
}
function onClock(){
  if(state.phase !== "claim") return null;
  var r = ranked();
  for(var i=0;i<r.length;i++){ if(!state.claims[r[i]]) return r[i]; }
  return null;
}
function takenSlots(){
  var t = {};
  for(var k in state.claims){ if(state.claims.hasOwnProperty(k)) t[state.claims[k]] = k; }
  return t;
}

/* ---------- countdown to the close of the combine ---------- */
function msLeft(){ return DEADLINE - Date.now(); }
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function deadlineText(){

  try{
    local = d.toLocaleString(undefined, {weekday:"short", month:"short", day:"numeric",
                                         hour:"numeric", minute:"2-digit"});
  }catch(e){ local = d.toString().slice(0,21); }
  return local;
}
function countdownInner(){

      + '<div class="cd-when">Draft day &middot; <b>Saturday, August 29</b></div>';
  }
  var t = Math.floor(ms/1000);

      mm = Math.floor((t%3600)/60), ss = t%60;
  function unit(n, l){ return '<div class="cd-unit"><div class="cd-n">'+pad2(n)+'</div><div class="cd-l">'+l+'</div></div>'; }
  return '<div class="cd-k">Combine closes in</div>'
    + '<div class="cd-clock">' + unit(dd,"days") + unit(hh,"hrs") + unit(mm,"min") + unit(ss,"sec") + '</div>'

}
function countdownCard(){

/* when the clock runs out the combine closes itself and the claims open */
function checkDeadline(){
  if(deadlineFired || state.ignoreDeadline) return;
  if(state.phase !== "combine" || msLeft() > 0) return;
  deadlineFired = true;
  state.phase = "claim";
  state.updated = Date.now();

/* ---------- game-over handling ---------- */
function resultMarkup(sc, prev, mode){
  var note = "", cls = "cool";
  if(mode === "posting"){ note = "Posting to the board&hellip;"; cls = "hot"; }
  else if(mode === "posted"){ note = "New personal best &mdash; posted"; cls = "hot"; }
  else if(mode === "conflict"){ note = "Someone posted first &mdash; refreshing"; cls = "cool"; }
  else if(mode === "readonly"){ note = "Best run &mdash; but this copy cannot post"; cls = "cool"; }
  else if(mode === "solo"){ note = "New best, saved on this phone"; cls = "hot"; }
  else if(mode === "failed"){ note = "Could not reach the board &mdash; saved, will retry"; cls = "cool"; }
  else { note = prev > 0 ? ("Best still stands at " + prev) : "Get on the board"; cls = "cool"; }
  return '<div class="ov-in">'
    + '<div class="ov-k">Final</div>'
    + '<div class="ov-score">'+sc+'</div>'
    + '<div class="ov-note '+cls+'">'+note+'</div>'
    + '<div class="btns">'
      + '<button class="btn btn-go" data-act="again">Run it back</button>'
      + '<button class="btn btn-ghost" data-act="scroll">The board</button>'
    + '</div></div>';
}
function showResult(sc, prev, mode){
  var ov = byId("ov"); if(!ov) return;
  ov.hidden = false;
  ov.innerHTML = resultMarkup(sc, prev, mode);
}

function onGameOver(sc){
  bumpRuns();
  var rec = state.scores[me] || {best:0, at:0};
  var prev = rec.best || 0;
  paintYou();

  if(sc <= prev){ showResult(sc, prev, "nobest"); return; }

  rec.best = sc; rec.at = Date.now();
  state.scores[me] = rec; state.updated = Date.now();
  lset(K_PEND, JSON.stringify({name:me, score:sc, at:rec.at}));
  sset(K_RES, JSON.stringify({score:sc, prev:prev}));
  paintYou(); paintBoard(); paintDraft();
  showResult(sc, prev, "posting");

  publishState().then(function(r){
    if(r.ok){ showResult(sc, prev, "posted"); return; }
    sdel(K_RES);
    if(r.code === "conflict"){ showResult(sc, prev, "conflict"); }
    else if(offline){ showResult(sc, prev, "solo"); }
    else if(readOnly || r.code === "offline"){ showResult(sc, prev, "readonly"); }
    else if(r.code === "rate_limited"){ showResult(sc, prev, "failed"); }
    else { showResult(sc, prev, "failed"); }
    paintStatus(); paintDraft();
  });
}

/* after a successful publish the view reloads; bring the result back with it */
function restoreResult(){
  var raw = sget(K_RES); if(!raw) return;
  sdel(K_RES);
  try{
    var r = JSON.parse(raw);
    setTimeout(function(){ showResult(r.score, r.prev, "posted"); }, 60);
  }catch(e){}
}

/* a score that never made it to the board gets one retry on the next load */
function healPending(){
  if(healed) return; healed = true;
  var raw = lget(K_PEND); if(!raw) return;
  var p; try{ p = JSON.parse(raw); }catch(e){ ldel(K_PEND); return; }
  if(!p || NAMES.indexOf(p.name) < 0){ ldel(K_PEND); return; }
  if(bestOf(p.name) >= p.score){ ldel(K_PEND); return; }
  if(!artifactApi) return;
  state.scores[p.name] = {best:p.score, at:p.at || Date.now()};
  state.updated = Date.now();
  paintBoard(); paintYou();
  publishState();
}

/* ---------- actions ---------- */
function claimSlot(slot){
  if(state.phase !== "claim" || onClock() !== me) return;
  if(takenSlots()[slot]) return;
  state.claims[me] = slot; state.updated = Date.now();
  paintDraft(); paintBoard();
  toast("Pick " + slot + " locked in");
  publishState().then(function(r){
    if(!r.ok && r.code !== "conflict"){ toast("That pick did not save"); paintStatus(); paintDraft(); }
  });
}
function commishDo(what){
  if(what === "lock"){ state.phase = "claim"; }
  else if(what === "reopen"){
    state.phase = "combine"; state.claims = {};
    state.ignoreDeadline = true; deadlineFired = false;   /* a manual reopen beats the clock */
  }
  else if(what === "wipe"){
    state.phase = "combine"; state.claims = {}; state.scores = {}; ldel(K_PEND);
    if(msLeft() <= 0){ state.ignoreDeadline = true; }
    deadlineFired = false;
  }
  state.updated = Date.now();
  paintBoard(); paintDraft(); paintCommish(); paintYou(); paintCountdown();
  publishState().then(function(r){
    if(!r.ok && r.code !== "conflict"){ toast("Change did not save"); paintStatus(); }
  });
}

function render(){

  if(screen === "main"){ mountGame(); restoreResult(); }
  window.scrollTo(0,0);
}
/* ---------- sound ---------- */
var actx = null;
function ping(kind){
  if(lget(K_MUTE) === "1") return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!actx) actx = new AC();
    if(actx.state === "suspended"){ actx.resume(); }
    var t0 = actx.currentTime;
    var o = actx.createOscillator(), g = actx.createGain();
    var f = kind === "flap" ? 400 : kind === "score" ? 640 : kind === "can" ? 880 : 170;
    o.type = kind === "dead" ? "sawtooth" : "square";
    o.frequency.setValueAtTime(f, t0);
    if(kind === "score" || kind === "can") o.frequency.exponentialRampToValueAtTime(f*1.55, t0+0.09);
    if(kind === "dead") o.frequency.exponentialRampToValueAtTime(64, t0+0.34);
    g.gain.setValueAtTime(kind === "flap" ? 0.035 : 0.06, t0);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + (kind === "dead" ? 0.38 : 0.14));
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + 0.45);
  }catch(e){}
}

/* ---------- the game ---------- */
var G = null;
function mountGame(){
  var cv = byId("cv"); if(!cv) return;
  if(G && G.destroy){ G.destroy(); }
  G = makeGame(cv);
}

function makeGame(cv){
  var VW=400, VH=640, GROUND=84, FLOOR=VH-GROUND;
  var BX=116, R=14, GRAV=0.42, FLAP=-7.1, MAXV=11.5;

  var ctx = cv.getContext("2d");
  var dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  cv.width = Math.round(VW*dpr); cv.height = Math.round(VH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  var stage = byId("stage"), hudEl = byId("hud"), ov = byId("ov");
  var reduce = false;
  try{ reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

  var mode="ready", y=0, vy=0, rot=0, score=0;
  var obs=[], parts=[], scroll=0, bob=0, flash=0, chant=null;
  var raf=0, lastT=0, alive=true;

  /* stable skyline */
  function mulberry(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry(20250825), sky = [], sx = 0;
  while(sx < VW + 340){
    var bw = 16 + rnd()*42, bh = 36 + rnd()*122;
    sky.push({x:sx, w:bw, h:bh, lit:rnd() < 0.6, warm:rnd() < 0.55});
    sx += bw + 3 + rnd()*14;
  }
  var SKYW = sx;

  function difficulty(){
    return {
      speed: 2.55 + Math.min(score*0.022, 2.15),
      gap:   178 - Math.min(score*1.0, 58),
      space: 234 - Math.min(score*1.15, 54)
    };
  }
  function addObs(){
    var d = difficulty();
    var lo = d.gap/2 + 54, hi = FLOOR - d.gap/2 - 58;
    var prev = obs.length ? obs[obs.length-1].gy : FLOOR*0.44;
    var a = Math.max(lo, prev - 155), b = Math.min(hi, prev + 155);
    if(b < a){ a = lo; b = hi; }
    obs.push({
      x: obs.length ? obs[obs.length-1].x + d.space : VW + 130,
      gy: a + Math.random()*(b-a),
      gh: d.gap, w: 62, passed:false,
      can: Math.random() < 0.46, kind: (Math.random() < 0.62 ? "leaf" : "can"), got:false
    });
  }
  function ensureObs(){
    var guard = 0;
    while(guard++ < 12 && (!obs.length || obs[obs.length-1].x + difficulty().space <= VW + 14)){ addObs(); }
  }
  function reset(){
    mode="ready"; y=FLOOR*0.42; vy=0; rot=0; score=0;
    obs=[]; parts=[]; scroll=0; bob=0; flash=0; chant=null;
    ensureObs(); hud();
  }
  function hud(){ if(hudEl) hudEl.textContent = score; }
  function readyOverlay(){
    ov.hidden = false;
    ov.innerHTML = '<div class="ov-in"><h3>Tap to hike</h3>'
      + '<p class="tip">Keep it off the turf. Split the uprights for <b style="color:var(--gold)">+1</b>, grab a buckeye leaf or a cold one for <b style="color:var(--gold)">+5</b>.</p>'
      + '<button class="btn btn-go btn-wide">Hike it</button></div>';
  }
  function launch(){
    reset(); mode="play"; ov.hidden = true;
    stage.style.touchAction = "none";
    vy = FLAP; rot = -0.42; lastT = performance.now(); ping("flap");
  }
  function flap(){ vy = FLAP; rot = -0.42; ping("flap"); }
  function die(){
    if(mode !== "play") return;
    mode = "dead"; flash = 1; ping("dead");
    burst(BX, y, "#E03A45", 20); burst(BX, y, "#F2C14E", 10);
    stage.style.touchAction = "pan-y";
    if(!reduce){
      stage.classList.add("shake");
      setTimeout(function(){ if(stage) stage.classList.remove("shake"); }, 340);
    }
    var final = score;
    setTimeout(function(){ if(alive) onGameOver(final); }, 620);
  }
  function burst(x, yy, color, n){
    for(var i=0;i<n;i++){
      parts.push({x:x, y:yy, vx:(Math.random()-0.5)*7.5, vy:(Math.random()-0.7)*7.5,
                  life:1, col:color, r:2 + Math.random()*3.2});
    }
  }
  function hitRect(cx, cy, r, rx, ry, rw, rh){
    if(rh <= 0) return false;
    var nx = cx < rx ? rx : (cx > rx+rw ? rx+rw : cx);
    var ny = cy < ry ? ry : (cy > ry+rh ? ry+rh : cy);
    var dx = cx-nx, dy = cy-ny;
    return dx*dx + dy*dy < r*r;
  }

  function step(dt){
    if(mode === "ready"){
      bob += 0.06*dt;
      y = FLOOR*0.42 + Math.sin(bob)*9;
      rot = Math.sin(bob)*0.12;
      return;
    }
    if(mode !== "play"){
      for(var q=0;q<parts.length;q++){ var pq=parts[q]; pq.vy+=0.34*dt; pq.x+=pq.vx*dt; pq.y+=pq.vy*dt; pq.life-=0.022*dt; }
      parts = parts.filter(function(p){ return p.life > 0; });
      if(flash > 0) flash -= 0.09*dt;
      if(chant){ chant.t -= 0.016*dt; if(chant.t <= 0) chant = null; }
      return;
    }

    var d = difficulty();
    vy += GRAV*dt; if(vy > MAXV) vy = MAXV;
    y += vy*dt;
    rot = Math.max(-0.55, Math.min(1.2, vy*0.058));
    scroll += d.speed*dt;

    for(var i=0;i<obs.length;i++){ obs[i].x -= d.speed*dt; }
    while(obs.length && obs[0].x + obs[0].w < -30){ obs.shift(); }
    ensureObs();

    for(var j=0;j<obs.length;j++){
      var o = obs[j], top = o.gy - o.gh/2, bot = o.gy + o.gh/2;
      if(!o.passed && o.x + o.w < BX){
        o.passed = true; score += 1; hud(); ping("score");
        if(score % 10 === 0){ chant = {text:(score % 20 === 0 ? "I-O!" : "O-H!"), t:1}; }
      }
      if(o.can && !o.got){
        var cx = o.x + o.w/2, dx = cx - BX, dy = o.gy - y;
        if(dx*dx + dy*dy < (R+15)*(R+15)){
          o.got = true; score += 5; hud(); ping("can");
          burst(cx, o.gy, o.kind === "leaf" ? "#6FC077" : "#F2C14E", 12);
          if(score % 10 === 0){ chant = {text:(score % 20 === 0 ? "I-O!" : "O-H!"), t:1}; }
        }
      }
      if(o.x < BX + R && o.x + o.w > BX - R){
        if(hitRect(BX,y,R, o.x, -60, o.w, top+60) || hitRect(BX,y,R, o.x, bot, o.w, FLOOR-bot)){ die(); return; }
      }
    }

    if(y + R >= FLOOR){ y = FLOOR - R; die(); return; }
    if(y - R < 2){ y = R + 2; if(vy < 0) vy = 0; }

    for(var p=0;p<parts.length;p++){ var pp=parts[p]; pp.vy+=0.34*dt; pp.x+=pp.vx*dt; pp.y+=pp.vy*dt; pp.life-=0.022*dt; }
    parts = parts.filter(function(x){ return x.life > 0; });
    if(chant){ chant.t -= 0.016*dt; if(chant.t <= 0) chant = null; }
  }

  function rr(x, yy, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, yy);
    ctx.arcTo(x+w, yy, x+w, yy+h, r);
    ctx.arcTo(x+w, yy+h, x, yy+h, r);
    ctx.arcTo(x, yy+h, x, yy, r);
    ctx.arcTo(x, yy, x+w, yy, r);
    ctx.closePath();
  }

  function drawSky(){
    var g = ctx.createLinearGradient(0,0,0,FLOOR);
    g.addColorStop(0, "#080C1E"); g.addColorStop(0.48, "#1B1339"); g.addColorStop(1, "#3E1A33");
    ctx.fillStyle = g; ctx.fillRect(0,0,VW,FLOOR);

    ctx.fillStyle = "rgba(242,193,78,.09)";
    ctx.beginPath(); ctx.arc(318, 84, 54, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#F7E4B2";
    ctx.beginPath(); ctx.arc(318, 84, 16, 0, 6.2832); ctx.fill();

    var off = (scroll*0.17) % SKYW;
    for(var pass=0; pass<2; pass++){
      var base = -off + pass*SKYW;
      for(var i=0;i<sky.length;i++){
        var b = sky[i], bx = base + b.x;
        if(bx > VW || bx + b.w < 0) continue;
        ctx.fillStyle = "#090D20";
        ctx.fillRect(bx, FLOOR - b.h, b.w, b.h);
        if(b.lit){
          ctx.fillStyle = b.warm ? "rgba(224,58,69,.40)" : "rgba(180,188,201,.28)";
          for(var wy = FLOOR - b.h + 10; wy < FLOOR - 12; wy += 14){
            for(var wx = bx + 5; wx < bx + b.w - 6; wx += 10){
              if((((wx|0)*7 + (wy|0)*13) % 3) === 0) ctx.fillRect(wx, wy, 3, 4);
            }
          }
        }
      }
    }
    drawStadium();
  }

  /* light standard: (x, baseY) is where it meets the rim, rising h upward */
  function tower(x, baseY, h){
    var headY = baseY - h;
    ctx.fillStyle = "rgba(255,246,214,.07)";
    ctx.beginPath(); ctx.arc(x, headY + 4, 58, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#0A0F22";
    ctx.fillRect(x - 2.5, headY, 5, h);
    ctx.fillRect(x - 14, headY - 16, 28, 16);
    ctx.fillStyle = "rgba(255,250,224,.85)";
    for(var r=0;r<2;r++){
      for(var c=0;c<4;c++){ ctx.fillRect(x - 11.5 + c*6.4, headY - 13 + r*7, 4.4, 4.4); }
    }
  }
  /* Ohio Stadium, rolling past in the distance */
  function drawStadium(){
    var span = 980, off = (scroll*0.13) % span;
    for(var pass=0; pass<2; pass++){
      var bx = -off + pass*span + 40;
      if(bx > VW + 360 || bx + 340 < -40) continue;
      var w = 328, h = 138, top = FLOOR - h;
      /* the bowl */
      ctx.fillStyle = "#161D3C";
      ctx.beginPath();
      ctx.moveTo(bx, FLOOR);
      ctx.lineTo(bx + 20, top + 34);
      ctx.quadraticCurveTo(bx + w/2, top - 22, bx + w - 20, top + 34);
      ctx.lineTo(bx + w, FLOOR);
      ctx.closePath(); ctx.fill();
      /* deck shadow + lit windows around the concourse */
      ctx.fillStyle = "rgba(8,12,28,.55)";
      ctx.fillRect(bx + 12, top + 62, w - 24, 16);
      ctx.fillStyle = "rgba(255,238,196,.30)";
      for(var c2 = bx + 26; c2 < bx + w - 28; c2 += 15){ ctx.fillRect(c2, top + 66, 7, 8); }
      /* scarlet + silver rim, the way the Horseshoe reads at night */
      ctx.strokeStyle = "rgba(224,58,69,.85)"; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(bx + 20, top + 34);
      ctx.quadraticCurveTo(bx + w/2, top - 22, bx + w - 20, top + 34);
      ctx.stroke();
      ctx.strokeStyle = "rgba(200,208,220,.5)"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(bx + 20, top + 41);
      ctx.quadraticCurveTo(bx + w/2, top - 15, bx + w - 20, top + 41);
      ctx.stroke();
      tower(bx + 34, top - 4, 46);
      tower(bx + w - 34, top - 4, 46);
    }
  }
  /* the block O at midfield */
  function drawBlockO(cx, cy, sc){
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(sc, sc);
    ctx.fillStyle = "rgba(224,58,69,.55)"; rr(-15, -19, 30, 38, 7); ctx.fill();
    ctx.fillStyle = "rgba(246,248,252,.30)"; rr(-11.5, -15.5, 23, 31, 5); ctx.fill();
    ctx.fillStyle = "rgba(16,62,40,.92)"; rr(-7, -10.5, 14, 21, 3); ctx.fill();
    ctx.restore();
  }
  /* a buckeye leaf: five leaflets off one stem */
  function drawLeaf(cx, cy){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.sin(scroll*0.03)*0.16);
    ctx.shadowColor = "rgba(111,192,119,.55)"; ctx.shadowBlur = 11;
    for(var i=0;i<5;i++){
      var a = -1.45 + (i/4)*2.9;
      ctx.save(); ctx.rotate(a);
      var g = ctx.createLinearGradient(0, 0, 0, -17);
      g.addColorStop(0, "#28602F"); g.addColorStop(1, "#77C87F");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, -9.5, 4, 9.5, 0, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#8A5A2B"; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, 1); ctx.lineTo(0, 9); ctx.stroke();
    ctx.restore();
  }

  function drawTurf(){
    var g = ctx.createLinearGradient(0, FLOOR, 0, VH);
    g.addColorStop(0, "#2B8A58"); g.addColorStop(1, "#103F28");
    ctx.fillStyle = g; ctx.fillRect(0, FLOOR, VW, GROUND);

    var off = scroll % 48;
    ctx.strokeStyle = "rgba(255,255,255,.20)"; ctx.lineWidth = 2;
    for(var x = -off; x < VW + 48; x += 48){
      ctx.beginPath(); ctx.moveTo(x, FLOOR); ctx.lineTo(x, VH); ctx.stroke();
    }
    ctx.strokeStyle = "rgba(255,255,255,.30)"; ctx.lineWidth = 3;
    for(var h = -off + 24; h < VW + 48; h += 48){
      ctx.beginPath(); ctx.moveTo(h, FLOOR + 30); ctx.lineTo(h, FLOOR + 42); ctx.stroke();
    }
    var oSpan = 470, oOff = scroll % oSpan;
    for(var pass=0; pass<2; pass++){
      var ox = -oOff + pass*oSpan + 150;
      if(ox > -40 && ox < VW + 40) drawBlockO(ox, FLOOR + GROUND*0.52, 0.86);
    }

    ctx.fillStyle = "#F2F5FA"; ctx.fillRect(0, FLOOR - 3, VW, 4);
    ctx.fillStyle = "#E03A45"; ctx.fillRect(0, FLOOR + 1, VW, 3);
  }

  function drawColumn(x, yy, w, h){
    if(h <= 0) return;
    var g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, "#7E5A11"); g.addColorStop(0.34, "#F2C14E");
    g.addColorStop(0.58, "#FFEBBC"); g.addColorStop(1, "#7E5A11");
    ctx.fillStyle = g; ctx.fillRect(x + 8, yy, w - 16, h);
  }
  function drawPost(o){
    var top = o.gy - o.gh/2, bot = o.gy + o.gh/2;
    ctx.save();
    ctx.shadowColor = "rgba(242,193,78,.5)"; ctx.shadowBlur = 15;
    drawColumn(o.x, -50, o.w, top + 50);
    drawColumn(o.x, bot, o.w, FLOOR - bot);
    ctx.restore();
    ctx.fillStyle = "#FFE7A8";
    ctx.fillRect(o.x - 5, top - 16, o.w + 10, 16);
    ctx.fillRect(o.x - 5, bot, o.w + 10, 16);
    ctx.fillStyle = "rgba(224,58,69,.9)";
    ctx.fillRect(o.x - 5, top - 6, o.w + 10, 4);
    ctx.fillRect(o.x - 5, bot + 12, o.w + 10, 4);
  }
  function drawCan(cx, cy){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.sin(scroll*0.035)*0.24);
    ctx.shadowColor = "rgba(242,193,78,.55)"; ctx.shadowBlur = 12;
    ctx.fillStyle = "#DCE2ED"; rr(-8, -13, 16, 26, 3.5); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#E03A45"; ctx.fillRect(-8, -5, 16, 10);
    ctx.fillStyle = "#F2C14E"; ctx.fillRect(-8, -13, 16, 3.5); ctx.fillRect(-8, 9.5, 16, 3.5);
    ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.fillRect(-5, -11, 2.5, 22);
    ctx.restore();
  }
  function drawBall(){
    ctx.save();
    ctx.translate(BX, y); ctx.rotate(rot);
    ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
    var g = ctx.createLinearGradient(0, -R, 0, R);
    g.addColorStop(0, "#B4642E"); g.addColorStop(1, "#5F2C12");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, R*1.36, R*0.95, 0, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = "#F6F2E7"; ctx.lineCap = "round";
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(-9.5, 0); ctx.lineTo(9.5, 0); ctx.stroke();
    ctx.lineWidth = 2;
    for(var i = -6; i <= 6; i += 4){
      ctx.beginPath(); ctx.moveTo(i, -3.6); ctx.lineTo(i, 3.6); ctx.stroke();
    }
    ctx.lineWidth = 2.6; ctx.strokeStyle = "rgba(246,242,231,.85)";
    ctx.beginPath(); ctx.moveTo(-R*1.02, -R*0.44); ctx.lineTo(-R*1.02, R*0.44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R*1.02, -R*0.44); ctx.lineTo(R*1.02, R*0.44); ctx.stroke();
    ctx.lineWidth = 1.8; ctx.strokeStyle = "rgba(224,58,69,.9)";
    ctx.beginPath(); ctx.moveTo(-R*0.76, -R*0.5); ctx.lineTo(-R*0.76, R*0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R*0.76, -R*0.5); ctx.lineTo(R*0.76, R*0.5); ctx.stroke();
    ctx.restore();
  }
  function drawParts(){
    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw(){
    drawSky();
    for(var i=0;i<obs.length;i++){
      var o = obs[i];
      drawPost(o);
      if(o.can && !o.got){
        if(o.kind === "leaf") drawLeaf(o.x + o.w/2, o.gy);
        else drawCan(o.x + o.w/2, o.gy);
      }
    }
    drawTurf();
    drawParts();
    drawBall();
    if(chant){
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, chant.t*2.4));
      ctx.translate(VW/2, FLOOR*0.28);
      var gs = 1.32 - chant.t*0.34;
      ctx.scale(gs, gs);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = '52px "Bungee", Impact, sans-serif';
      ctx.lineWidth = 8; ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(7,10,20,.9)"; ctx.strokeText(chant.text, 0, 0);
      ctx.fillStyle = chant.text === "O-H!" ? "#E8404B" : "#F4F7FC";
      ctx.fillText(chant.text, 0, 0);
      ctx.restore();
    }
    if(flash > 0){
      ctx.fillStyle = "rgba(255,235,200," + (flash*0.5) + ")";
      ctx.fillRect(0, 0, VW, VH);
    }
  }

  function loop(now){
    if(!alive) return;
    var dt = (now - lastT) / 16.6667;
    lastT = now;
    if(!isFinite(dt) || dt < 0) dt = 1;
    if(dt > 2.4) dt = 2.4;
    step(dt);
    draw();
    raf = requestAnimationFrame(loop);
  }

  function onDown(e){
    if(e.target && e.target.closest && e.target.closest("[data-mute]")) return;
    if(mode === "ready"){ launch(); }
    else if(mode === "play"){ e.preventDefault(); flap(); }
  }
  function onKey(e){
    if(screen !== "main") return;
    if(e.code === "Space" || e.code === "ArrowUp" || e.key === " " || e.key === "ArrowUp"){
      e.preventDefault();
      if(mode === "ready") launch();
      else if(mode === "play") flap();
    }
  }

  stage.addEventListener("pointerdown", onDown);
  document.addEventListener("keydown", onKey);

  reset();
  readyOverlay();
  lastT = performance.now();
  raf = requestAnimationFrame(loop);

  return {
    restart: function(){ launch(); },
    destroy: function(){
      alive = false;
      cancelAnimationFrame(raf);
      stage.removeEventListener("pointerdown", onDown);
      document.removeEventListener("keydown", onKey);
    }
  };
}

/* ---------- wiring ---------- */
var armed = null, armTimer = null;
function armConfirm(btn){
  if(armed === btn){
    clearTimeout(armTimer); armed = null;
    commishDo(btn.getAttribute("data-do"));
    return;
  }
  if(armed && armed.getAttribute("data-label")){ armed.textContent = armed.getAttribute("data-label"); }
  armed = btn;
  if(!btn.getAttribute("data-label")) btn.setAttribute("data-label", btn.textContent);
  btn.textContent = "Tap again to confirm";
  clearTimeout(armTimer);
  armTimer = setTimeout(function(){
    if(armed === btn){ btn.textContent = btn.getAttribute("data-label"); armed = null; }
  }, 3800);
}

byId("app").addEventListener("click", function(e){
  var t = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
  if(!t) return;
  var a = t.getAttribute("data-act");
  if(a === "pick"){ pendingName = t.getAttribute("data-name"); render(); }
  else if(a === "lockin"){
    if(!pendingName) return;
    me = pendingName; lset(K_ME, me); setHashName(me); loadRuns();
    screen = "main"; render();
  }
  else if(a === "switch"){ pendingName = me; screen = "select"; if(G && G.destroy) G.destroy(); render(); }
  else if(a === "again"){ if(G && G.restart) G.restart(); }
  else if(a === "scroll"){
    var b = byId("board");
    if(b) b.scrollIntoView({behavior:"smooth", block:"center"});
  }
  else if(a === "mute"){
    var m = lget(K_MUTE) === "1";
    lset(K_MUTE, m ? "0" : "1");
    t.textContent = m ? "♪" : "✕";
  }
  else if(a === "claim"){ claimSlot(parseInt(t.getAttribute("data-slot"), 10)); }
  else if(a === "confirm"){ armConfirm(t); }
});

/* ---------- boot ---------- */
render();

setInterval(function(){
  paintCountdown();
  checkDeadline();
}, 1000);
checkDeadline();

if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("artifact").then(function(a){
    artifactApi = a || null;
    if(!a) readOnly = true;
    capSettled = true;
    paintStatus(); paintDraft(); healPending();
  }, function(){
    artifactApi = null; readOnly = true; capSettled = true;
    paintStatus(); paintDraft();
  });
}else{
  artifactApi = null; offline = true; capSettled = true;
  paintStatus(); paintDraft();
}

})();
</script>
