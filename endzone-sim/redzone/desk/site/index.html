<title>Redzone Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:ital,wght@1,700;1,800&family=Saira+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a broadcast desk. Wordmark bar, a score ticker of every game, then one column of pick "look-ins"
   you tap open. Deliberately one dark look (a TV graphics package), with every color set explicitly. */
:root{
  --bg:#07080C; --panel:#10131B; --panel2:#171B26; --line:#262B3A;
  --red:#E1141E; --red-deep:#8E0B12; --gold:#FFC629; --text:#F2F3F7; --mist:#9AA1B4; --dim:#646B80;
  --win:#3DD68C; --loss:#FF5A60; --push:#9AA1B4;
  --f-disp:"Saira Extra Condensed","Arial Narrow",Impact,sans-serif;
  --f-cond:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---- top bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px;border-bottom:3px solid var(--red);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--f-disp);font-style:italic;font-weight:800;font-size:30px;line-height:1;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px}
.mark .rz{background:var(--red);color:#fff;padding:2px 10px 0 8px;transform:skewX(-10deg);display:inline-block}
.mark .rz span{display:inline-block;transform:skewX(10deg)}
.mark .desk{color:var(--gold)}
.wk{font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.recs{display:flex;gap:8px;flex-wrap:wrap}
.rec{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);padding:4px 10px;border-radius:3px;font-variant-numeric:tabular-nums}
.rec b{color:var(--gold);font-weight:700}

/* ---- ticker ---- */
.ticker{overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.ticker::-webkit-scrollbar{display:none}
.tk{display:flex;gap:0;width:max-content}
.tg{font-family:var(--f-cond);font-weight:600;font-size:14px;padding:8px 14px;border-right:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;display:grid;grid-template-columns:auto auto;column-gap:10px}
.tg .w{color:var(--gold)}
.tg small{grid-column:1/-1;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* ---- tabs ---- */
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font-family:var(--f-disp);font-style:italic;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.02em;padding:6px 14px 4px;color:var(--mist);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gold)}
.note{color:var(--mist);font-size:13px}
.note b{color:var(--text)}

/* ---- pick rows ---- */
.list{display:flex;flex-direction:column;gap:6px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:4px;display:grid;grid-template-columns:64px 1fr auto;align-items:stretch}
.pick.open{border-color:var(--red)}
.pbtn{grid-column:1/3;display:grid;grid-template-columns:64px 1fr;text-align:left;align-items:center;min-width:0}
.prob{font-family:var(--f-disp);font-style:italic;font-weight:800;font-size:28px;color:var(--gold);text-align:center;font-variant-numeric:tabular-nums;padding:10px 0}
.prob.mid{color:var(--text)}
.body{padding:10px 6px 10px 2px;min-width:0}
.ptxt{font-family:var(--f-cond);font-weight:700;font-size:18px;line-height:1.15}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px;color:var(--mist);font-size:12.5px}
.chip{font-family:var(--f-cond);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--red-deep);color:#fff;padding:1px 7px;border-radius:2px}
.chip.td{background:var(--red)}
.edge{font-family:var(--f-cond);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap}
.edge.e2{background:var(--win);color:#06140C}.edge.e1{border:1px solid var(--win);color:var(--win)}.edge.e0{border:1px solid var(--line);color:var(--mist)}
.edge.e-1{border:1px solid var(--loss);color:var(--loss)}.edge.e-2{background:var(--loss);color:#1A0506}
.mu .prob{font-size:20px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table.cov{width:100%;border-collapse:collapse;font-family:var(--f-cond);font-size:15px;font-variant-numeric:tabular-nums}
table.cov th{font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.cov td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.cov tr:last-child td{border-bottom:0}
table.cov small{font-size:11.5px;font-weight:600}
table.cov small.up{color:var(--gold)} table.cov small.dn{color:var(--mist)}
.odds{font-family:var(--f-cond);font-weight:700;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.odds small{font-weight:600;font-size:11.5px;color:var(--mist);letter-spacing:.04em}
.odds.none{font-size:12px;font-weight:600;color:var(--dim)}
.track{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:0 14px;border-left:1px solid var(--line);color:var(--mist);min-width:78px}
.track:hover{color:var(--text)}
.track.on{color:var(--bg);background:var(--gold)}
.why{grid-column:1/-1;border-top:1px solid var(--line);padding:10px 16px 12px 22px;margin:0;display:flex;flex-direction:column;gap:5px;color:#D6D9E3;font-size:14px}
.why li::marker{color:var(--red)}
.res{font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.08em;padding:1px 7px;border-radius:2px;text-transform:uppercase}
.res.W{background:var(--win);color:#06140C}.res.L{background:var(--loss);color:#1A0506}.res.P{background:var(--push);color:#0B0C10}.res.O{border:1px solid var(--line);color:var(--mist)}

/* ---- games ---- */
.game{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(90deg,var(--red-deep),var(--panel2) 60%);flex-wrap:wrap}
.teams{font-family:var(--f-disp);font-style:italic;font-weight:800;font-size:24px;text-transform:uppercase;line-height:1;font-variant-numeric:tabular-nums}
.teams .s{color:var(--gold)}
.kick{font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#E5E7EE}
.gbody{padding:8px;display:flex;flex-direction:column;gap:6px}
.gbody .pick{background:var(--panel2)}
.sub{font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);padding:6px 6px 0}

/* ---- my picks / record ---- */
.mine-acts{display:flex;gap:4px;padding:0 10px;align-items:center;border-left:1px solid var(--line)}
.mine-acts button{font-family:var(--f-cond);font-weight:700;font-size:12px;width:28px;height:28px;border:1px solid var(--line);border-radius:3px;color:var(--mist)}
.mine-acts button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.stat .k{font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.stat .v{font-family:var(--f-disp);font-style:italic;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:16px;color:var(--gold);margin-left:6px}
.stat .u{font-family:var(--f-cond);font-weight:700;font-size:15px;color:var(--win);font-variant-numeric:tabular-nums}
.stat .u.neg{color:var(--loss)}
h2{font-family:var(--f-disp);font-style:italic;font-weight:800;font-size:22px;text-transform:uppercase;margin:6px 0 0;text-wrap:balance}
.empty{border:1px dashed var(--line);border-radius:4px;padding:18px;color:var(--mist);text-align:center}
.nb{font-family:var(--f-cond);font-weight:700;font-size:11px;letter-spacing:.06em;padding:1px 7px;border-radius:2px;white-space:nowrap}
.nb.out{background:var(--loss);color:#1A0506}.nb.risk{background:var(--gold);color:#1A1400}.nb.stale{border:1px solid var(--gold);color:var(--gold)}
.nb.watch{border:1px solid var(--mist);color:var(--mist)}.nb.up{border:1px solid var(--win);color:var(--win)}
.pick.scr{opacity:.55}
.why li.news{color:var(--text);list-style:none;margin-left:-14px;padding:6px 10px;background:var(--panel2);border-left:3px solid var(--gold);border-radius:2px}
.why li.news b{color:var(--gold);font-weight:600}
.gnews{margin:0;padding:8px 14px 10px 30px;border-bottom:1px solid var(--line);color:#D6D9E3;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.gnews li::marker{color:var(--gold)}
.newsbar{border:1px solid var(--line);border-left:3px solid var(--gold);background:var(--panel);border-radius:4px;padding:10px 14px;color:var(--mist);font-size:13.5px}
.newsbar b{color:var(--text)}
.newsbar button{color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.scrl{color:var(--dim);font-size:12.5px;padding:2px 6px}
/* ---- TD scorers ---- */
.filt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filt .lab{font-family:var(--f-cond);font-weight:700;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-right:2px}
.fchip{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border:1px solid var(--line);border-radius:3px;color:var(--mist);background:var(--panel)}
.fchip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.fsel{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 8px;min-height:30px}
.pos{font-family:var(--f-cond);font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--text);border:1px solid var(--line);padding:0 6px;border-radius:2px}
.more{font-family:var(--f-cond);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);padding:10px;border:1px dashed var(--line);border-radius:4px}
@media (max-width:480px){table.cov{font-size:13.5px}table.cov th,table.cov td{padding:7px 5px}table.cov th{font-size:10px;letter-spacing:.04em}.tab{font-size:16px;padding:6px 8px 4px}.pick{grid-template-columns:54px 1fr auto}.pbtn{grid-template-columns:54px 1fr}.prob{font-size:24px}.ptxt{font-size:16px}.track{min-width:64px;padding:0 10px}}
@media (prefers-reduced-motion:no-preference){.pick,.track{transition:border-color .15s,background .15s,color .15s}}
</style>

<style>
/* research edition: facts lists, book-vs-desk tags, the defense style table and the method page */
.bk{font-family:var(--f-cond);font-weight:600;font-size:12px;color:var(--mist);font-variant-numeric:tabular-nums}
.bk b{color:var(--text);font-weight:700}
.fxs{display:flex;flex-direction:column;gap:10px;padding:10px 14px 12px;border-bottom:1px solid var(--line)}
.fxh{font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 3px}
.fx{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;color:#D6D9E3;font-size:13.5px}
.fx li::marker{color:var(--red)}
.fx .src{color:var(--dim);font-size:11.5px;margin-left:4px}
.fx li.o::marker{color:var(--win)} .fx li.d::marker{color:var(--loss)}
.fx li.o b{color:var(--win);font-weight:600} .fx li.d b{color:var(--loss);font-weight:600}
.final{font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--text);color:var(--bg);padding:1px 7px;border-radius:2px;margin-left:8px}
.lines{font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.04em;color:#E5E7EE;font-variant-numeric:tabular-nums}
.lines b{color:var(--gold)}
.kp{background:var(--panel2);border:1px solid var(--line);border-radius:4px}
.kp summary{cursor:pointer;padding:8px 12px;font-family:var(--f-cond);font-weight:700;font-size:16px;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kp summary::-webkit-details-marker{display:none}
.kp summary::before{content:"+";color:var(--gold);width:12px}
.kp[open] summary::before{content:"–"}
.kp .fx{padding:0 14px 10px 30px}
.gsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table.sty{width:100%;border-collapse:collapse;font-family:var(--f-cond);font-size:14px;font-variant-numeric:tabular-nums}
table.sty th{font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);text-align:center;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.sty th:first-child,table.sty td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
table.sty td{text-align:center;padding:5px 6px;border-bottom:1px solid var(--line)}
table.sty tr:last-child td{border-bottom:0}
table.sty td.g{color:#06140C;background:var(--win)} table.sty td.g2{color:var(--win)}
table.sty td.r{color:#1A0506;background:var(--loss)} table.sty td.r2{color:var(--loss)}
table.sty th button{color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
table.sty th button[aria-pressed="true"]{color:var(--gold)}
.method{display:flex;flex-direction:column;gap:12px;color:#D6D9E3;font-size:14.5px}
.method p{margin:0}
.method h3{font-family:var(--f-cond);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:6px 0 0}
.method ol,.method ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.method code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:2px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 14px}
.rule table{width:100%;border-collapse:collapse;font-size:13.5px}
.rule td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
.rule td:first-child{font-family:var(--f-cond);font-weight:700;white-space:nowrap;color:var(--text)}
.rule td.n{font-family:var(--f-cond);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--gold)}
@media (max-width:480px){.fxs{padding:8px 10px}.kp summary{font-size:15px}table.sty{font-size:12.5px}}
</style>

<div class="wrap">
  <header class="bar">
    <div>
      <div class="mark"><span class="rz"><span>Redzone</span></span><span class="desk">Desk</span></div>

</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=x=>Math.round(100*x)+'%';
const st={tab:'top',D:null,arch:[],open:new Set(),mine:{},grades:{},db:null,local:false,
  td:{pos:'all',game:'all',sort:'value',all:false},yd:{game:'all',sort:'value'},game:'all',sty:'pa'};
try{const t=localStorage.getItem('rzd-tab'); if(t) st.tab=t;}catch(e){}

/* ---------- data: this week (research edition) + older weeks kept so tracked picks and the record still resolve ---------- */
function load(){
  st.D=JSON.parse(document.getElementById('rzdata').textContent);
  st.arch=JSON.parse(document.getElementById('rzarchive').textContent);
  if(!['top','games','td','yds','mu','news','mine','record','how'].includes(st.tab)) st.tab='top';
}
const allPicks=()=>{const m={}; for(const a of st.arch) for(const p of a.picks) m[p.id]={...p,week:a.week}; for(const p of st.D.picks) m[p.id]={...p,week:st.D.week}; return m;};
function resultOf(id){ return st.grades[id]||null; }

/* ---------- storage: the page database (shared, so Claude can grade), else this device ---------- */
async function initDb(){
  let db=null; try{ db=await window.claude?.use?.('db'); }catch(e){}
  if(!db){ st.local=true; try{ st.mine=JSON.parse(localStorage.getItem('rzd-mine')||'{}'); }catch(e){} render(); return; }
  st.db=db;
  db.collection('mine').onSnapshot(s=>{ const m={}; s.docs.forEach(d=>m[d.id]=d.data()); st.mine=m; render(); }, ()=>{});
  db.collection('grades').onSnapshot(s=>{ const g={}; s.docs.forEach(d=>Object.assign(g,(d.data()||{}).results||{})); st.grades=g; render(); }, ()=>{});
}
async function saveMine(id,body){
  if(st.local){ const k=mineKey(id); if(body) st.mine[k]=body; else delete st.mine[k]; try{localStorage.setItem('rzd-mine',JSON.stringify(st.mine));}catch(e){} render(); return; }
  const ref=st.db.collection('mine').doc(mineKey(id));
  try{ if(body) await ref.set(body); else await ref.delete(); }catch(e){ flash('Could not save. Try again in a moment.'); }
}
function flash(t){ const n=$('#wk'); const o=n.textContent; n.textContent=t; setTimeout(()=>n.textContent=o,2500); }
const mineKey=id=>id.replace(/[^A-Za-z0-9_.~:@+-]/g,'-');
const isTracked=id=>!!st.mine[mineKey(id)];
function toggleTrack(p){
  if(isTracked(p.id)) saveMine(p.id,null);
  else saveMine(p.id,{id:p.id,week:p.week??st.D.week,type:p.type,text:p.text,game:p.game,prob:+p.prob.toFixed(3),odds:p.price?p.price.odds:null,addedAt:new Date().toISOString()});
}

/* ---------- records ---------- */
/* units: 1 unit risked per pick at the price posted when it went on the board */
let AP0={};
function oddsOf(id){ const p=AP0[id]; return p&&p.price&&p.price.odds!=null?p.price.odds:null; }
/* the Desk record: every research-desk Top plays board this season (each game's board as locked at kickoff) */
const seasonBoard=()=>[...new Set([...st.arch.filter(a=>a.research).flatMap(a=>a.board),...st.D.board])];
const payout=o=>o>0?o/100:100/-o;
function tally(ids,odds=oddsOf){ const r={W:0,L:0,P:0,O:0,u:0,priced:0}; ids.forEach(id=>{const x=st.grades[id]||null; r[x||'O']++; const o=odds(id);
  if(o!=null&&(x==='W'||x==='L')){ r.u+=x==='W'?payout(o):-1; r.priced++; }}); return r; }
const recTxt=r=>`${r.W}-${r.L}${r.P?'-'+r.P:''}`;
const uTxt=r=>r.priced?`${r.u>=0?'+':'−'}${Math.abs(r.u).toFixed(1)}u`:'—';
const winPct=r=>r.W+r.L?Math.round(100*r.W/(r.W+r.L))+'%':'—';

/* ---------- news ---------- */
const fmtd=s=>new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/New_York'});
let NEWS={players:{},games:{}};
try{NEWS=JSON.parse(document.getElementById('rznews').textContent);}catch(e){}
NEWS.players=NEWS.players||{}; NEWS.games=NEWS.games||{};
const NBL={out:'Out',risk:'At risk',watch:'Monitor',up:'Upside',stale:'Stale'};
function pnews(p){ const t=p.player||p.n||p.text||''; for(const n in NEWS.players) if(t===n||t.startsWith(n+' ')) return NEWS.players[n]; return null; }
const isOut=p=>p.out||(pnews(p)||{}).s==='out';
const nbadge=x=>x?`<span class="nb ${x.s}">${NBL[x.s]}</span>`:'';
const nline=x=>x?`<li class="news"><b>News ${esc(NEWS.asOf)}:</b> ${esc(x.n)}</li>`:'';

/* ---------- small pieces ---------- */
const fmtOdds=o=>(o>0?'+':'')+o;
function oddsTag(p){ return p.price?`<span class="odds" title="${esc(p.price.src)}">${fmtOdds(p.price.odds)}</span>`:`<span class="odds none">Price pending</span>`; }
const val=p=>p.book!=null?p.prob-p.book:0;
function edgeTag(p){
  if(p.type==='Winner'||p.type==='Spread') return `<span class="edge e0">Book number</span>`;
  if(p.book==null) return '';
  const d=Math.round(100*val(p)), c=d>=5?2:d>=2?1:d>-2?0:d>-5?-1:-2;
  return `<span class="edge e${c}">${d>0?'+':''}${d} vs book</span><span class="bk">book <b>${pct(p.book)}</b></span>`;
}
function pickRow(p,{showTrack=true,label=null}={}){
  const open=st.open.has(p.id), res=resultOf(p.id), on=isTracked(p.id), nx=pnews(p);
  return `<div class="pick${open?' open':''}${isOut(p)?' scr':''}">
    <button class="pbtn" data-open="${esc(p.id)}" aria-expanded="${open}">
      <div class="prob${p.prob<.6?' mid':''}">${pct(p.prob)}</div>
      <div class="body"><div class="ptxt">${esc(label||p.text)}</div>
        <div class="meta">${p.type==='Anytime TD'&&label?`<span class="pos">${esc(p.team)} ${esc(p.pos||'')}</span>`:`<span class="chip${p.type==='Anytime TD'?' td':''}">${esc(p.type)}</span>`}${edgeTag(p)}${nbadge(nx)}${oddsTag(p)}<span>${esc(p.game)}</span>${res?`<span class="res ${res}">${{W:'Win',L:'Loss',P:'Push'}[res]}</span>`:''}</div></div>
    </button>
    ${showTrack?`<button class="track${on?' on':''}" data-track="${esc(p.id)}" aria-pressed="${on}">${on?'Tracked':'+ Track'}</button>`:'<span></span>'}
    ${open?`<ul class="why">${nline(nx)}${(p.why||[]).map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}
  </div>`;
}
const EDGE={'Edge':2,'Slight edge':1,'Even':0,'Slightly tough':-1,'Tough':-2};
function muRow(m){
  const open=st.open.has(m.id), s=Math.round(100*m.score), nx=pnews({n:m.n});
  return `<div class="pick mu${open?' open':''}${nx&&nx.s==='out'?' scr':''}"><button class="pbtn" data-open="${esc(m.id)}" aria-expanded="${open}" style="grid-column:1/-1">
    <div class="prob${Math.abs(m.score)<.03?' mid':''}">${s>0?'+':''}${s}%</div>
    <div class="body"><div class="ptxt">${esc(m.n)} <span style="color:var(--mist);font-weight:600">vs</span> ${esc(m.vs)}</div>
      <div class="meta"><span class="edge e${EDGE[m.edge]}">${esc(m.edge)}</span>${nbadge(nx)}<span>${esc(m.off)} ${esc(m.pos)} · ${esc(m.role)} · ${esc(m.game)}</span></div></div></button>
    ${open?`<ul class="why">${nline(nx)}${m.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}</div>`;
}
function lineTxt(g){
  const s=g.line.spread, fav=s<0?g.home:g.away, n=Math.abs(s);
  return n?`${fav} −${n}`:'Pick';
}
const fl=(items,cls='')=>items.length?`<ul class="fx">${items.map(f=>`<li class="${f.cls||cls}">${f.html||esc(f.text)}${f.src?`<span class="src">${esc(f.src)}</span>`:''}</li>`).join('')}</ul>`:'';
function factsBlock(g){
  const F=g.facts, side=t=>{const s=F.sides[t]; return [...s.team,...s.qb,...s.coach];};
  const sty=t=>(F.styles[t]||[]).map(x=>({text:x.text,cls:x.side==='off'?'o':'d'}));
  const cov=t=>((F.coverage||{})[t]||[]).map(x=>({text:x.text,cls:x.cls}));
  const blocks=[[`${g.away} ${g.awayName}`,side(g.away)],[`${g.home} ${g.homeName}`,side(g.home)],['Head to head',F.h2h],
    ['Reported this week',(F.reported||[]).map(r=>({text:r.text,src:r.src}))],
    [`${g.away} offense vs ${g.home} defense`,sty(g.away)],[`${g.home} offense vs ${g.away} defense`,sty(g.home)],
    [`${g.away} passing vs ${g.home} coverage`,cov(g.away)],[`${g.home} passing vs ${g.away} coverage`,cov(g.home)]];
  return `<div class="fxs">${blocks.filter(b=>b[1].length).map(([h,it])=>`<div><div class="fxh">${esc(h)}</div>${fl(it)}</div>`).join('')}
    ${(F.styles[g.away]||[]).length+(F.styles[g.home]||[]).length?`<p class="note" style="margin:0;font-size:12px">Green: favors the offense (its habit meets a weak spot, or its QB/receivers do better against the coverage this defense plays). Red: favors the defense. Styles and coverage are this season only.</p>`:''}</div>`;
}
const gamePicks=(g,type)=>st.D.picks.filter(p=>p.gameId===g.id&&p.type===type&&!isOut(p));
function gameCard(g,full=true){
  const gn=NEWS.games[g.id]||[];
  const head=`<div class="ghead"><div class="teams">${g.final?`${g.away} <span class="s">${g.final.away}</span> · ${g.home} <span class="s">${g.final.home}</span><span class="final">Final</span>`:`${g.away} @ ${g.home}`}</div>
    <div><div class="kick">${esc(g.kick)}</div><div class="lines">${esc(lineTxt(g))} · O/U ${g.line.total}${g.deskTotal!=null?` · Desk <b>${g.deskTotal}</b>`:''}</div></div></div>`;
  if(g.final) return `<section class="game">${head}${gn.length?`<ul class="gnews">${gn.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${factsBlock(g)}<div class="gbody"><p class="note" style="margin:0">Final. These were the facts going in.</p></div></section>`;
  const tds=gamePicks(g,'Anytime TD').sort((a,b)=>b.prob-a.prob).slice(0,6);
  const yd=gamePicks(g,'Yards').sort((a,b)=>val(b)-val(a)).slice(0,4);
  const scr=[...new Set(st.D.picks.filter(p=>p.gameId===g.id&&isOut(p)&&p.type==='Anytime TD').map(p=>p.player))];
  const keys=(g.keys||[]).map(k=>`<details class="kp"><summary>${esc(k.name)} <span class="pos">${esc(k.team)} ${esc(k.pos)}</span>${nbadge(pnews({n:k.name}))}</summary>${fl(k.facts.map(t=>({text:t})))}</details>`).join('');
  return `<section class="game">${head}
    ${gn.length?`<ul class="gnews">${gn.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${full?factsBlock(g):''}
    <div class="gbody">${[g.tot,g.ats,g.ml].map(p=>pickRow(p)).join('')}
    <div class="sub">Touchdowns</div>${tds.map(p=>pickRow(p)).join('')}${scr.length?`<div class="scrl">Removed (out): ${scr.map(esc).join(', ')}</div>`:''}
    ${yd.length?`<div class="sub">Yards: biggest moves off the book</div>${yd.map(p=>pickRow(p)).join('')}`:''}
    ${full&&keys?`<div class="sub">Key players</div>${keys}`:''}
    ${full&&(g.mu||[]).length?`<div class="sub">Coverage and run matchups</div>${g.mu.map(muRow).join('')}`:''}</div></section>`;
}
const liveGames=()=>st.D.games.filter(g=>!g.final&&!g.started);
const liveTeams=()=>new Set(liveGames().flatMap(g=>[g.away,g.home]));
const gameSelect=(id,cur,withAll=true)=>`<select class="fsel" id="${id}" aria-label="Game">${withAll?`<option value="all">All games</option>`:''}${liveGames().map(g=>`<option value="${esc(g.id)}"${cur===g.id?' selected':''}>${esc(g.away)} @ ${esc(g.home)}</option>`).join('')}</select>`;

/* ---------- views ---------- */
function render(){
  const D=st.D; if(!D) return;
  const P=Object.fromEntries(D.picks.map(p=>[p.id,p])); AP0=allPicks();
  $('#wk').textContent=`${D.label} · research edition · ${D.prices.td?'TD prices '+fmtd(D.prices.td):'TD prices pending'}${D.prices.props?' · props '+fmtd(D.prices.props):' · props pending'} · lines ${fmtd(D.prices.lines_at)}${NEWS.asOf?' · news '+NEWS.asOf:''}`;
  const allBoards=[...D.board,...st.arch.flatMap(a=>a.board)];
  const sr=tally(seasonBoard());
  $('#recs').innerHTML=`<span class="rec" title="Every research-desk Top play this season, locked at kickoff; 1 unit per pick at the posted price">Desk season <b>${recTxt(sr)}</b> · <b>${uTxt(sr)}</b></span>`;
  $('#ticker').innerHTML=[...liveGames(),...D.games.filter(g=>g.started&&!g.final),...D.games.filter(g=>g.final)].map(g=>`<div class="tg">${g.final?`<span>${g.away} ${g.final.away}</span><span>${g.home} ${g.final.home}</span><small>Final</small>`:g.started?`<span>${g.away} @ ${g.home}</span><span class="w">${esc(lineTxt(g))}</span><small>Kicked off · board locked</small>`:
    `<span>${g.away} @ ${g.home}</span><span class="w">${esc(lineTxt(g))}</span><small>${esc(g.kick)} · O/U ${g.line.total}${g.deskTotal!=null?` → ${g.deskTotal}`:''}</small>`}</div>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===st.tab));
  const v=$('#view');
  if(st.tab==='top'){
    const fl=D.board.filter(id=>pnews(P[id])).length;
    v.innerHTML=`${D.slateNote?`<div class="newsbar">${D.slateNote}</div>`:''}<p class="note">Every pick the facts moved far enough off the book to count${D.slateNote?' in what is left to play':' this week'}, biggest edge first. Each one counts in the Desk record once its game kicks off. Every number starts at the sportsbook's price; the facts in each pick move it a little, and the tag shows by how much. Tap a pick to see each fact and what it was worth; <b>How it's made</b> has the rules.</p>
      ${fl?`<div class="newsbar"><b>${fl} of ${D.board.length} have injury news.</b> The books already moved on it, so it is shown but not added. <button data-t="news">Read the news</button></div>`:''}
      <div class="list">${D.board.length?D.board.map(id=>pickRow(P[id])).join(''):`<div class="empty">Nothing clears the bar yet.${!D.prices.td||!D.prices.props?' Player TD and yardage prices for this slate aren\'t posted in the free feeds yet; the board refills when they are.':''} Every game's line, total and facts are under <b>Games</b>.</div>`}</div>`;
  } else if(st.tab==='games'){
    const gs=liveGames().filter(g=>st.game==='all'||g.id===st.game);
    v.innerHTML=`<div class="gsel"><span class="note">Every game: the trends, the head-to-head, how each offense's habits meet the other defense, key players and matchups.</span>${gameSelect('gsel',st.game)}</div>
      <div class="list">${gs.map(g=>gameCard(g)).join('')}</div>`;
  } else if(st.tab==='td'){
    const T=st.td, all=D.picks.filter(p=>p.type==='Anytime TD'&&!isOut(p));
    let rows=all.filter(p=>(T.pos==='all'||p.pos===T.pos)&&(T.game==='all'||p.gameId===T.game));
    rows.sort(T.sort==='value'?(a,b)=>val(b)-val(a):(a,b)=>b.prob-a.prob);
    const shown=T.all||T.game!=='all'?rows:rows.slice(0,30);
    const chip=(k,x,lab)=>`<button class="fchip" data-td="${k}" data-v="${x}" aria-pressed="${T[k]===x}">${lab}</button>`;
    v.innerHTML=`<p class="note">Every player with a posted anytime TD price. The big number is the Desk's chance; <b>book</b> is the price's implied chance; the tag is the difference. ${T.sort==='value'?'Sorted by the biggest move up from the book.':'Most likely first.'}</p>
      <div class="filt"><span class="lab">Sort</span>${chip('sort','value','Vs book')}${chip('sort','prob','Most likely')}</div>
      <div class="filt"><span class="lab">Pos</span>${chip('pos','all','All')}${['RB','WR','TE','QB'].map(x=>chip('pos',x,x)).join('')}${gameSelect('tdgame',T.game)}</div>
      <div class="list">${shown.length?shown.map(p=>pickRow(p,{label:p.player})).join(''):`<div class="empty">${all.length?'No touchdown picks match.':'No anytime TD prices posted for '+liveGames().map(g=>g.away+' @ '+g.home).join(', ')+' yet.'}</div>`}</div>
      ${shown.length<rows.length?`<button class="more" data-td="all" data-v="1">Show all ${rows.length}</button>`:''}`;
  } else if(st.tab==='yds'){
    const Y=st.yd; let rows=D.picks.filter(p=>p.type==='Yards'&&!isOut(p)&&(Y.game==='all'||p.gameId===Y.game));
    rows.sort(Y.sort==='value'?(a,b)=>val(b)-val(a):(a,b)=>b.prob-a.prob);
    const chip=(k,x,lab)=>`<button class="fchip" data-yd="${k}" data-v="${x}" aria-pressed="${Y[k]===x}">${lab}</button>`;
    v.innerHTML=`<p class="note">Receiving and rushing yardage lines (DraftKings first, then FanDuel and BetMGM). The Desk takes the book's no-vig chance and moves it with the matchup facts; each pick shows the side the facts favor.</p>
      <div class="filt"><span class="lab">Sort</span>${chip('sort','value','Vs book')}${chip('sort','prob','Most likely')}${gameSelect('ydgame',Y.game)}</div>
      <div class="list">${rows.map(p=>pickRow(p)).join('')||'<div class="empty">No yardage lines posted for this game yet.</div>'}</div>`;
  } else if(st.tab==='mu'){
    const all=D.games.flatMap(g=>g.mu||[]), rec=all.filter(m=>m.role==='coverage'), rbs=all.filter(m=>m.pos==='RB');
    const best=rec.filter(m=>m.score>=.03).sort((a,b)=>b.score-a.score).slice(0,15), worst=rec.filter(m=>m.score<=-.03).sort((a,b)=>a.score-b.score).slice(0,10);
    const rbBest=rbs.filter(m=>m.score>=.03).sort((a,b)=>b.score-a.score).slice(0,10), rbWorst=rbs.filter(m=>m.score<=-.03).sort((a,b)=>a.score-b.score).slice(0,8);
    const cv=D.coverage||[];
    const S=D.styles, keys=[...S.keys,{key:'epa_pass',dfn:'all passes'},{key:'epa_rush',dfn:'all runs'}];
    const sk=st.sty, rowsS=[...S.defense].sort((a,b)=>(a[sk+'_rk']??99)-(b[sk+'_rk']??99));
    const cell=(r,k)=>{const rk=r[k+'_rk']; if(rk==null) return '<td>—</td>'; const c=rk<=4?'g':rk<=8?'g2':rk>=29?'r':rk>=25?'r2':''; return `<td class="${c}" title="${r[k]!=null?(r[k]>0?'+':'')+r[k].toFixed(2)+' EPA/play':''}">${rk}</td>`;};
    v.innerHTML=`<p class="note">Pass catchers: this defense's 2026 yards per target allowed to his position, plus his own 2026 yards per target against the blitz (weighed by this defense's blitz rate) and against man-heavy or zone-heavy defenses (when this defense is one). All this season. Backs: his inside/outside run mix against what this defense allows inside and outside this season. The number is the change to his yards per target or carry. Tap one for the details.</p>
      <h2>Receivers: best coverage fits</h2><div class="list">${best.map(muRow).join('')}</div>
      <h2>Receivers: toughest</h2><div class="list">${worst.map(muRow).join('')}</div>
      <h2>Running backs: best run fits</h2><div class="list">${rbBest.map(muRow).join('')}</div>
      <h2>Running backs: toughest</h2><div class="list">${rbWorst.map(muRow).join('')}</div>
      <h2>Defenses vs offense styles</h2><p class="note">Each defense's rank of 32 in EPA allowed per play against each kind of play, 2026 only (five games, so small samples). 1 = best. Green: top 8. Red: bottom 8. Tap a column to sort; hover a cell for the EPA.</p>
      <div class="tblwrap"><table class="sty"><thead><tr><th>Defense</th>${keys.map(k=>`<th><button data-sty="${k.key}" aria-pressed="${sk===k.key}">${esc(k.dfn)}</button></th>`).join('')}</tr></thead>
      <tbody>${rowsS.map(r=>`<tr><td><b>${esc(r.team)}</b></td>${keys.map(k=>cell(r,k.key)).join('')}</tr>`).join('')}</tbody></table></div>
      ${cv.length?`<h2>Coverage this week</h2><p class="note">Every defense on the slate, this season. Man, zone, single-high (Cover 0/1/3) and two-high (Cover 2/4/6) rates and yards per target allowed by position are Sharp Football Analysis through Week 5; small type is the rank of 32. Blitz is FTN charting (5+ rushers).</p>
      <div class="tblwrap"><table class="cov"><thead><tr><th>Defense</th><th>vs</th><th>Man</th><th>Zone</th><th>1-high</th><th>2-high</th><th>Blitz</th><th>YPT WR</th><th>TE</th><th>RB</th><th>Out</th><th>Slot</th></tr></thead><tbody>
      ${cv.map(c=>`<tr><td><b>${esc(c.team)}</b></td><td>${esc(c.opp)}</td><td>${pct(c.man)} <small class="up">${c.manRk}</small></td><td>${pct(c.zone)}</td><td>${pct(c.hi)} <small class="up">${c.hiRk}</small></td><td>${pct(c.lo)}</td><td>${c.blitz!=null?pct(c.blitz):'—'}</td><td>${c.wr.toFixed(1)}</td><td>${c.te.toFixed(1)}</td><td>${c.rb.toFixed(1)}</td><td>${c.out.toFixed(1)}</td><td>${c.slot.toFixed(1)}</td></tr>`).join('')}
      </tbody></table></div>`:''}`;
  } else if(st.tab==='news'){
    const fb=D.board.map(id=>P[id]).filter(p=>pnews(p));
    const gm=Object.fromEntries(D.games.map(g=>[g.id,g]));
    v.innerHTML=`<p class="note">${esc(NEWS.about||'')}</p>
      ${fb.length?`<h2>Top plays with news</h2><div class="list">${fb.map(p=>pickRow(p)).join('')}</div>`:''}
      ${(NEWS.outs||[]).filter(o=>!o.t||liveTeams().has(o.t)).length?`<h2>Ruled out or not expected to play</h2><p class="note">${esc(NEWS.bar||'')}</p><ul class="gnews" style="border-bottom:0;padding-left:22px">${NEWS.outs.filter(o=>!o.t||liveTeams().has(o.t)).map(o=>`<li><b>${esc(o.n)}</b>${o.t?' ('+esc(o.t)+')':''}${o.r?': '+esc(o.r):''}</li>`).join('')}</ul>`:''}
      <h2>By game</h2><div class="list">${liveGames().filter(g=>(NEWS.games[g.id]||[]).length).map(g=>`<section class="game"><div class="ghead"><div class="teams">${g.away} · ${g.home}</div><div class="kick">${esc(g.kick)}</div></div><ul class="gnews" style="border-bottom:0">${NEWS.games[g.id].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`).join('')}</div>
      ${(NEWS.sources||[]).length?`<h2>Sources</h2><ul class="gnews" style="border-bottom:0;padding-left:22px;word-break:break-all">${NEWS.sources.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}`;
  } else if(st.tab==='mine'){
    const rows=Object.values(st.mine).sort((a,b)=>(b.addedAt||'').localeCompare(a.addedAt||'')), AP=allPicks();
    v.innerHTML=(st.local?`<p class="note">Picks save on this device only in this view.</p>`:'')+(rows.length?`<div class="list">${rows.map(m=>{
      const p=AP[m.id]||{...m,why:['This pick is from a week no longer on the board.']}; const r=resultOf(m.id);
      return `<div class="pick${st.open.has(m.id)?' open':''}"><button class="pbtn" data-open="${esc(m.id)}" aria-expanded="${st.open.has(m.id)}"><div class="prob${m.prob<.6?' mid':''}">${pct(m.prob)}</div>
        <div class="body"><div class="ptxt">${esc(m.text)}</div><div class="meta"><span class="chip">${esc(m.type)}</span>${m.odds!=null?`<span class="odds">${fmtOdds(m.odds)}</span>`:''}<span>Wk ${m.week} · ${esc(m.game)}</span><span class="res ${r||'O'}">${r?{W:'Win',L:'Loss',P:'Push'}[r]:'Open'}</span></div></div></button>
        <div class="mine-acts"><button data-track="${esc(m.id)}" aria-label="Remove">✕</button></div>
        ${st.open.has(m.id)?`<ul class="why">${(p.why||[]).map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}</div>`;}).join('')}</div>`
      :`<div class="empty">No picks tracked yet. Open <b>Top plays</b> or <b>Games</b> and tap <b>+ Track</b> on any pick.</div>`);
  } else if(st.tab==='record'){
    const AP=allPicks();
    const card=(k,r)=>`<div class="stat"><div class="k">${esc(k)}</div><div class="v">${recTxt(r)}<small>${winPct(r)}</small></div><div class="u${r.u<0?' neg':''}">${uTxt(r)}</div></div>`;
    const types=ids=>[...new Set(ids.map(i=>(AP[i]||{}).type).filter(Boolean))];
    const sect=(h,note,ids)=>`<h2>${esc(h)}</h2><p class="note">${note}</p><div class="grid">${card('All',tally(ids))}${types(ids).map(t=>card(t,tally(ids.filter(i=>AP[i].type===t)))).join('')}</div>`;
    v.innerHTML=`<p class="note"><b>Units:</b> 1 unit risked on every pick at the price posted when it went on the board. A win at -110 pays +0.91u, a win at +250 pays +2.5u, a loss is -1u, pushes are 0. Each game's Top plays lock at kickoff.</p>`+
      sect('Season to date','Every research-desk Top play this season (Week 5 on), graded by Claude after the games. This is the Desk record in the header.',seasonBoard())+
      sect(D.boardLabel||`Week ${D.week}: research desk`,'This week\'s Top plays for games still to play. They lock at kickoff.',D.board)+
      st.arch.slice().reverse().map(a=>sect(a.label,a.note||'Built by the old simulation model (retired). Not in the season record.',a.board)).join('')+
      `<p class="note">Results fill in when Claude grades the week.</p>`;
  } else {
    v.innerHTML=methodHtml(D);
  }
}
function methodHtml(D){
  const R=D.rules, row=(k,x,unit)=>`<tr><td>${esc(k)}</td><td>${esc(x.what||'')}</td><td class="n">${x.w!=null?'weight '+x.w:''}${x.cap!=null?` · cap ${unit==='pts'?'±'+x.cap+' pts':unit==='logit'?'±'+x.cap:'±'+Math.round(100*x.cap)+'% of line'}`:''}${x.hot!=null?`+${x.hot} / ${x.cold}`:''}</td></tr>`;
  const tbl=(o,unit)=>`<table>${Object.entries(o).filter(([k,x])=>typeof x==='object'&&!Array.isArray(x)&&!k.startsWith('_')&&k!=='override_2026').map(([k,x])=>row(k.replace(/_/g,' '),x,unit)).join('')}</table>`;
  return `<div class="method">
  <p><b>There is no model on this page anymore.</b> No simulation, no team ratings, nothing fitted to past results. Every number is one of three things: a sportsbook price, a fact counted from games that already happened, or a small nudge from one of those facts with a fixed weight written down below.</p>
  <h3>1. Start at the book</h3>
  <ul><li><b>Anytime TDs:</b> the best price posted across US books (${D.prices.td?'pulled '+esc(new Date(D.prices.td).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))+' ET':'not posted for this slate yet'}), turned into a chance: +150 is 40%.</li>
  <li><b>Game totals:</b> the consensus total and its over/under prices, with the book's margin removed, so it starts near 50%.</li>
  <li><b>Yardage over/unders:</b> DraftKings' line and prices (FanDuel, BetMGM, BetRivers, Bovada if DraftKings has none), margin removed.</li>
  <li><b>Spreads and moneylines:</b> shown at the book's number. The Desk lists the facts but does not move sides.</li></ul>
  <h3>2. Find the facts</h3>
  <p><b>Coverage matchups use this season only.</b> Everything else (trends, records, player history) uses every season available.</p>
  <ul><li><b>Trends</b> from every game since 1999 with its closing line (nflverse): against the spread and over/under this season, current streaks, last 10/20, as favorite or underdog, home or road, after a win or loss, prime time, division games, head to head, and each starting QB's and head coach's record in the same spot. A trend only shows if it is lopsided over enough games (about 70/30 or more over 8+ games, or a streak of 4+); the season record and head-to-head always show.</li>
  <li><b>Reported trends</b> from this week's betting previews (Covers, SI, NBC, FanDuel and others) that need data the game file doesn't have; each is labeled with the outlet.</li>
  <li><b>Player facts</b> from play-by-play 2019-2026: this season's usage and red-zone share, TD streaks and droughts, history against this opponent, prime-time splits, and how often he has cleared this week's yardage line.</li>
  <li><b>Coverage:</b> each defense's 2026 man, zone, single-high and two-high rates, yards per target allowed to WRs, TEs and RBs and to outside and slot receivers, and box and sub-package rates (Sharp Football Analysis, through Week 5); its 2026 blitz rate (FTN charting, 5+ rushers). Each QB's and pass catcher's 2026 numbers against man-heavy defenses (Sharp's top 10 in man rate) and zone-heavy defenses (bottom 10), and against the blitz and no blitz. Nobody publishes free play-by-play man/zone tags during the season, so a player's man/zone split is built from the defenses he has faced this season. Small samples are pulled toward his own average (15 targets, 30 attempts).</li>
  <li><b>Defense vs offense style:</b> 2026 EPA allowed per play against play-action, motion, deep passes, screens, inside and outside runs, shotgun and under-center runs and middle-of-field throws, ranked 1-32; and how much each offense leans on each one.</li>
  <li><b>News:</b> injuries and lineup changes from team sites and national outlets. The book prices were posted after this news, so it is shown but not added.</li></ul>
  <h3>3. Nudge, with the weights in the open</h3>
  <p>Each fact that bears on a pick moves it by a fixed weight, and each move has a cap so one hot stat can't run away. Small samples (five games of 2026) are pulled toward the league average first: four games' worth for per-game stats, ten red-zone trips, fifteen targets, forty carries. Every pick lists each fact and what it was worth.</p>
  <div class="rule"><b>Anytime TD</b> <span class="note">${esc(R.td._about)}</span>${tbl(R.td,'logit')}</div>
  <div class="rule"><b>Game totals</b> <span class="note">${esc(R.total._about)}</span>${tbl(R.total,'pts')}</div>
  <div class="rule"><b>Yardage over/unders</b> <span class="note">${esc(R.yards._about)}</span>${tbl(R.yards,'line')}</div>
  <h3>4. What goes on Top plays</h3>
  ${R.board?`<p>The TDs, totals and yardage picks the facts moved most off the book, largest first: TDs at least ${Math.round(100*R.board.td.min_edge)} points above the book, totals at least ${Math.round(100*R.board.total.min_edge)} points, yardage at least ${Math.round(100*R.board.yards.min_edge)} points. There is no limit on how many: every pick that clears the bar goes on the board and counts. The Desk chance must also beat the break-even of the posted price with the margin in: at -110 that is 52.4%, at -113 it is 53.1%.</p>
  <p><b>Locked at kickoff.</b> When a game kicks off, its Top plays are frozen as they stood on the page and can't be changed by a later rebuild. The Desk record counts only those locked boards, 1 unit per pick at the posted price.</p>`:`<p>The TDs, totals and yardage picks the facts moved most off the book: TDs at least 2 points above the book, totals at least 2 points, yardage at least 4 points, largest first.</p>`}
  <h3>What this isn't</h3>
  <p>None of this was tested on past weeks; you asked for facts, not a backtest. Books already know most of these facts, which is why the weights are small. Treat a +5 as "the facts lean this way", not as a guaranteed edge.</p>
  <p class="note">Built by <code>endzone-sim/redzone/desk/build.py</code> from nflverse play-by-play (2019-2026) and FTN charting, Sharp Football Analysis 2026 team tables, nflverse schedules and lines, DraftKings-led props (nfl-player-prop-opportunity) and best-price anytime TD odds (NFL-Model's live pull). Generated ${esc(new Date(D.generated).toLocaleString('en-US',{timeZone:'America/New_York'}))} ET.</p></div>`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t],[data-open],[data-track],[data-td],[data-yd],[data-sty]'); if(!t) return;
  if(t.dataset.sty){ st.sty=t.dataset.sty; render(); return; }
  if(t.dataset.td){ const k=t.dataset.td; st.td[k]=k==='all'?true:t.dataset.v; if(k!=='all') st.td.all=false; render(); return; }
  if(t.dataset.yd){ st.yd[t.dataset.yd]=t.dataset.v; render(); return; }
  if(t.dataset.t){ st.tab=t.dataset.t; try{localStorage.setItem('rzd-tab',st.tab);}catch(e){} render(); window.scrollTo(0,0); return; }
  if(t.dataset.open){ const id=t.dataset.open; st.open.has(id)?st.open.delete(id):st.open.add(id); render(); return; }
  const AP=allPicks();
  if(t.dataset.track){ const id=t.dataset.track; toggleTrack(AP[id]||st.mine[mineKey(id)]||{id}); return; }
});
document.addEventListener('change',e=>{
  if(e.target.id==='tdgame'){ st.td.game=e.target.value; st.td.all=false; render(); }
  if(e.target.id==='ydgame'){ st.yd.game=e.target.value; render(); }
  if(e.target.id==='gsel'){ st.game=e.target.value; render(); }
});
try{ load(); render(); initDb(); }catch(err){ $('#wk').textContent='Picks file missing. Ask Claude to republish the Redzone Desk.'; }
</script>
